name: HyperLauncher v1.0.1 Visual Release

on:
  workflow_dispatch:
  push:
    branches:
      - "v1.0-release"
    tags:
      - "v1.0.0"

permissions:
  contents: read

jobs:
  release-apk:
    name: Build and verify HyperLauncher v1.0 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.veeresh.hyperlauncher' versionCode='101' versionName='1.0.1'"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          echo "Verified release APK: $(du -h "$APK" | cut -f1)"

      - name: Upload final v1.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperLauncher-v1.0.1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
